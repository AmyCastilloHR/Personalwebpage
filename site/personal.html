<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amy Castillo | Off the clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="data.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html"><i></i><span id="brand"></span></a>
  <button class="menu-btn" aria-label="Menu" aria-expanded="false" onclick="const n=this.closest('.nav');const o=n.classList.toggle('open');this.setAttribute('aria-expanded',o)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path class="m-open" d="M4 6h16M4 12h16M4 18h16"/><path class="m-close" d="M6 6l12 12M18 6L6 18"/></svg></button>
  <ul onclick="if(event.target.closest('a')){const n=this.closest('.nav');n.classList.remove('open');n.querySelector('.menu-btn').setAttribute('aria-expanded',false)}">
    <li><a href="index.html">Consulting</a></li>
    <li><a href="#travel">Travel</a></li>
    <li><a href="#interests">Hobbies</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</div></nav>

<section id="travel" data-screen-label="Travel"><div class="wrap sec">
  <div class="sec-head"><span class="num">01</span><h2>Travel</h2><p style="color:var(--muted);font-size:15px">A big part of my life. Updated after every trip.</p></div>
  <div>
    <div class="travel-top">
      <div class="seg" role="group" aria-label="Map">
        <button data-view="world" aria-pressed="true">World</button>
        <button data-view="us" aria-pressed="false">United States</button>
      </div>
      <div class="count" id="t-count"></div>
    </div>
    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 960 500" role="img" aria-label="Travel map"></svg>
      <div class="legend"><span><i style="background:var(--coral)"></i>Visited</span><span><i style="background:#f4ae98"></i>Planned</span><span><i style="background:var(--land)"></i>Not yet</span></div>
      <div class="tip" id="tip"></div>
    </div>
    <ul class="visited" id="t-list"></ul>
    <p class="mapnote" id="t-note"></p>
  </div>
</div></section>

<section id="interests" data-screen-label="Interests"><div class="wrap sec">
  <div class="sec-head"><span class="num">02</span><h2>Hobbies &amp; interests</h2></div>
  <div class="grid-cells" id="ints"></div>
</div></section>

<div class="wrap back"><a href="index.html">← Back to the consulting home page</a></div>
<footer id="contact" data-page="personal"></footer>

<script>
const S = window.SITE, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = x => typeof x === 'string' ? { name: x, years: [] } : { years: [], ...x };
const countries = S.travel.countries.map(norm), states = S.travel.states.map(norm);
const pCountries = (S.travel.plannedCountries || []).map(norm), pStates = (S.travel.plannedStates || []).map(norm);

$('brand').textContent = S.name;
const ICONS = {
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
  design: '<path d="M13 7 8.7 2.7a2.41 2.41 0 0 0-3.4 0L2.7 5.3a2.41 2.41 0 0 0 0 3.4L7 13"/><path d="m8 6 2-2"/><path d="m18 16 2-2"/><path d="m17 11 4.3 4.3c.94.94.94 2.46 0 3.4l-2.6 2.6c-.94.94-2.46.94-3.4 0L11 17"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  dumbbell: '<path d="M14.4 14.4 9.6 9.6"/><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"/><path d="m21.5 21.5-1.4-1.4"/><path d="M3.9 3.9 2.5 2.5"/><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  mountain: '<path d="m8 3 4 8 5-5 5 15H2L8 3z"/>',
  paw: '<circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>',
  theater: '<path d="M2 10s3-3 3-8"/><path d="M22 10s-3-3-3-8"/><path d="M10 2c0 4.4-3.6 8-8 8"/><path d="M14 2c0 4.4 3.6 8 8 8"/><path d="M2 10s2 2 2 5"/><path d="M22 10s-2 2-2 5"/><path d="M8 15h8"/><path d="M2 22v-1a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1"/><path d="M14 22v-1a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1"/>'
};
$('ints').innerHTML = S.interests.map((it, i) => `
  <div class="int"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--coral-deep)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[it.icon] || ''}</svg><h3>${esc(it.title)}</h3><p>${esc(it.text)}</p></div>`).join('');

/* ── Travel map ── */
const ALIAS = {
  'united states':'united states of america','usa':'united states of america','us':'united states of america',
  'uk':'united kingdom','england':'united kingdom','scotland':'united kingdom','wales':'united kingdom','great britain':'united kingdom',
  'czech republic':'czechia','drc':'dem. rep. congo','democratic republic of the congo':'dem. rep. congo',
  'bosnia and herzegovina':'bosnia and herz.','bosnia':'bosnia and herz.','dominican republic':'dominican rep.',
  'central african republic':'central african rep.','south sudan':'s. sudan','ivory coast':"côte d'ivoire",
  'tanzania & zanzibar':'tanzania','zanzibar':'tanzania','viet nam':'vietnam','swaziland':'eswatini','burma':'myanmar','holland':'netherlands','the netherlands':'netherlands',
  'uae':'united arab emirates','korea':'south korea','republic of korea':'south korea','equatorial guinea':'eq. guinea',
  'solomon islands':'solomon is.','falkland islands':'falkland is.','western sahara':'w. sahara','north macedonia':'macedonia'
};
const key = n => { const k = n.trim().toLowerCase(); return ALIAS[k] || k; };
const W = 960, H = 500, svg = window.d3 ? d3.select('#map') : null, tip = $('tip'), box = $('mapbox');
const geo = {};
let view = 'world';

const fmtYears = y => y.length ? y.join(', ') : '';
function renderList() {
  const arr = view === 'world' ? countries : states;
  $('t-count').innerHTML = arr.length + ` <small>/ ${view === 'world' ? 195 : 50} ${view === 'world' ? 'countries' : 'states'}</small>`;
  $('t-list').innerHTML = [...arr].sort((a, b) => a.name.localeCompare(b.name))
    .map(d => `<li>${esc(d.name)}<span>${esc(fmtYears(d.years))}</span></li>`).join('') +
    (view === 'world' ? pCountries : pStates).map(d => `<li style="color:var(--coral-deep)">${esc(d.name)}<span style="color:var(--coral-deep)">Planned</span></li>`).join('');
}

function draw() {
  const g = geo[view]; if (!g) return;
  const visited = new Map((view === 'world' ? countries : states).map(d => [key(d.name), d]));
  const planned = new Map((view === 'world' ? pCountries : pStates).map(d => [key(d.name), d]));
  const proj = (view === 'world' ? d3.geoNaturalEarth1() : d3.geoAlbersUsa()).fitExtent([[12, 12], [W - 12, H - 40]], g);
  const path = d3.geoPath(proj);
  svg.selectAll('*').remove();
  const found = new Set();
  svg.selectAll('path').data(g.features).join('path')
    .attr('class', f => { const v = visited.has(key(f.properties.name)); if (v) found.add(key(f.properties.name)); return 'geo' + (v ? ' on' : planned.has(key(f.properties.name)) ? ' plan' : ''); })
    .attr('d', path)
    .on('mousemove', (e, f) => {
      const r = box.getBoundingClientRect(), v = visited.get(key(f.properties.name));
      tip.innerHTML = esc(f.properties.name) + (v ? `<em>Visited${v.years.length ? ' · ' + esc(fmtYears(v.years)) : ''}</em>` : planned.has(key(f.properties.name)) ? '<em>Planned</em>' : '');
      tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.style.opacity = 1;
    })
    .on('mouseleave', () => tip.style.opacity = 0)
    .on('click', function (e, f) { d3.select(this).dispatch('mousemove', { detail: e }); });
  const missing = [...visited.keys()].filter(k => !found.has(k)).map(k => visited.get(k).name);
  $('t-note').textContent = missing.length ? `Too small to show at this scale (still counted): ${missing.join(', ')}.` : '';
  if (missing.length) console.info('[travel] not on map:', missing);
  renderList();
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  draw();
}));

const mapFailed = () => { $('t-note').textContent = 'The map could not load right now. The full list is below.'; };
renderList();
if (window.d3 && window.topojson) {
  Promise.all([
    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json'),
    d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json')
  ]).then(([w, u]) => {
    const wf = topojson.feature(w, w.objects.countries);
    wf.features = wf.features.filter(f => f.properties.name !== 'Antarctica');
    geo.world = wf;
    geo.us = topojson.feature(u, u.objects.states);
    geo.us.features = geo.us.features.filter(f => f.properties.name !== 'District of Columbia');
    draw();
  }).catch(mapFailed);
} else mapFailed();
</script>
<script src="footer.js"></script>
</body>
</html>
