<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Expertise — Amy Castillo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="data.js"></script>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="index.html"><i></i><span id="brand"></span></a>
  <button class="menu-btn" aria-label="Menu" aria-expanded="false" onclick="const n=this.closest('.nav');const o=n.classList.toggle('open');this.setAttribute('aria-expanded',o)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path class="m-open" d="M4 6h16M4 12h16M4 18h16"/><path class="m-close" d="M6 6l12 12M18 6L6 18"/></svg></button>
  <ul onclick="if(event.target.closest('a')){const n=this.closest('.nav');n.classList.remove('open');n.querySelector('.menu-btn').setAttribute('aria-expanded',false)}">
    <li><a href="index.html#services">Services</a></li>
    <li><a href="index.html#results">Results</a></li>
    <li><a href="index.html#experience">Experience</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</div></nav>

<main class="wrap" data-screen-label="Expertise">
  <div class="tabs" id="tabs"></div>
  <div class="xhead">
    <div class="sec-head" style="padding-top:8px"><span class="label">HR expertise</span></div>
    <div><h1 id="x-title"></h1><p id="x-intro"></p></div>
  </div>
  <div class="rel-offer" id="rel-offer"></div>
  <div id="x-projects"></div>
  <div class="xtools">
    <span class="label" style="padding-top:10px">Tools &amp; methods</span>
    <div class="chips" id="x-tools"></div>
  </div>
  <div class="back"><a href="#" onclick="event.preventDefault();window.scrollTo({top:0,behavior:'smooth'})">↑ Back to all expertise</a></div>
</main>


<footer id="contact"></footer>

<script>
const S = window.SITE, A = S.hrAreas, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('brand').textContent = S.name;

const bookHref = S.bookingUrl || `mailto:${S.email}?subject=${encodeURIComponent('20-minute conversation')}`;
document.querySelectorAll('.book').forEach(a => { a.href = bookHref; if (S.bookingUrl) { a.target = '_blank'; a.rel = 'noopener'; } });
const card = p => p.metric ? `
  <div class="result">
    <div class="metric">${esc(p.metric)}<small>${esc(p.metricLabel || '')}</small></div>
    <div class="r-body"><span class="r-co">${esc(p.company)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p>${p.link ? `<a class="xlink" href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.linkLabel || 'Details')} ↗</a>` : ''}</div>
  </div>` : `<div class="result plain"><div class="r-body"><span class="r-co">${esc(p.company)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div></div>`;
const item = p => {
  if (p.see) { const t = A.find(x => x.id === p.see); return `<div class="init see"><span class="label">See also</span><a href="expertise-${p.see}.html">${esc(p.title)} · ${esc(t ? t.title : '')} →</a></div>`; }
  return `<div class="init"><span class="r-co">${esc(p.company)}</span>${p.metric ? `<div class="imetric">${esc(p.metric)}<small>${esc(p.metricLabel || '')}</small></div>` : ''}<h3>${esc(p.title)}</h3><p>${esc(p.text)}</p></div>`;
};
const group = (label, items) => `<div class="xgroup"><div class="xgroup-head"><span class="label">${esc(label)}</span></div><div class="results big">${items.map(card).join('')}</div></div>`;
function render() {
  const i = Math.max(0, A.findIndex(a => a.id === (document.body.dataset.area || location.hash.slice(1))));
  const a = A[i];
  document.title = a.title + ' HR expertise | ' + S.name;
  $('tabs').innerHTML = A.map(x => `<a href="expertise-${x.id}.html" aria-current="${x === a}">${esc(x.title)}</a>`).join('');
  $('x-title').textContent = a.title;
  $('x-intro').textContent = a.intro;
  const o = S.offers.find(x => x.id === a.offer);
  $('rel-offer').innerHTML = o ? `<span class="label">Related offer</span><a href="index.html#offer-${esc(o.id)}">${esc(o.title)} →</a>` : '';
  $('rel-offer').style.display = o ? '' : 'none';
  const more = a.more || [];
  $('x-projects').innerHTML =
    (a.sections || []).map(s => group(s.title, s.items)).join('') +
    ((a.top || []).length ? group(a.sections ? 'Key results' : 'Measurable results', a.top) : '') +
    (more.length ? `<div class="xgroup"><div class="xgroup-head"><span class="label">More programs</span></div><div class="initiatives">${more.map(item).join('')}</div></div>` : '');
  $('x-tools').innerHTML = (a.tools || []).map(t => `<span>${esc(t)}</span>`).join('');
}
render();
</script>
<script src="footer.js"></script>
</body>
</html>
